version: '3'
networks:
  app-tier:
    driver: bridge

services:
  database:
    image: bitnami/mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    networks:
      - "app-tier"
    volumes:
      - /Users/marulisihotang/Documents/app-jisdac/database:/bitnami/mysql/data
  
  backend:
    image: nginx
    volumes:
      - /Users/marulisihotang/Documents/app-jisdac/backend:/usr/share/nginx/html
      - /Users/marulisihotang/Documents/app-jisdac/backend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - "app-tier"
    depends_on:
      - database
    ports:
      - "3000:3000"

  frontend:
    image: nginx
    volumes:
      - /Users/marulisihotang/Documents/app-jisdac/frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - database
      - backend