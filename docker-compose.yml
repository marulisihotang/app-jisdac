version: '3'
networks:
  app-tier:
    driver: bridge

services:
  database:
    image: mysql:lts
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    # expose:
    #   - 3306
    networks:
      - "app-tier"
    volumes:
      - ./database:/var/lib/mysql

  backend:
    image: leorance/jisdac-node:v2.0
    networks:
      - "app-tier"
    environment:
      - APP_NAME=jisdacapp
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_HOSTNAME=database
      - DB_NAME=sample
      - DB_DIALECT=mysql
      - DB_PORT=3306
      - NODE_ENV=production
    depends_on:
      - database
    ports:
      - "3000:3000"
    # expose:
    #   - 3000

  frontend:
    image: nginx
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - database
      # - backend