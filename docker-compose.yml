version: '3'
networks:
  app-tier:
    driver: bridge

services:
  database:
    image: bitnami/mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    networks:
      - "app-tier"
    volumes:
      - ./database:/bitnami/mysql/data
  
  backend:
    image: nginx
    volumes:
      - ./backend:/usr/share/nginx/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - "app-tier"
    depends_on:
      - database
    ports:
      - "3000:3000"

  frontend:
    image: nginx
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"
    depends_on:
      - database
      - backend